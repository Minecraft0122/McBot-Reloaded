modLoader="javafml"
loaderVersion="[28,)"
license="GPL-3.0-or-later"
issueTrackerURL="https://github.com/Minecraft0122/McBot-Reloaded/issues"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    logoFile="icon.png"
    authors="cnlimiter, Minecraft0122"
    displayURL="https://github.com/Minecraft0122/McBot-Reloaded"
    description='''
    连接 Minecraft 服务器与 QQ 群，支持双向聊天转发和服务器信息查询命令。
    '''

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="SERVER"
