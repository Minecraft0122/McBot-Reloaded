pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven { url "https://maven.architectury.dev/" }
    }
}

rootProject.name = 'McBot'
include (
        "common",
        "fabric",
        "forge"
)
