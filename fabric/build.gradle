plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

println "Fabric Loader: $fabric_loader_version（无需 Fabric API）"

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    jupiterCoreSource {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionFabric'))

    implementation shadowBundle("cn.evole.onebot:OneBot-Client:$onebot_client_version"){transitive = false}
    implementation shadowBundle("com.github.houbb:csv:0.2.0")
    modCompileOnly ("curse.maven:jupiter-1072905:$jupiter_fabric_version")
    jupiterCoreSource ("curse.maven:jupiter-1072905:$jupiter_fabric_version")
    modCompileOnly ("com.terraformersmc:modmenu:$modmenu_version")
}

def jupiterCoreJar = tasks.register('jupiterCoreJar', Jar) {
    archiveFileName = 'mcbot-jupiter-core.jar'
    destinationDirectory = layout.buildDirectory.dir('jupiter-core')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from({ zipTree(configurations.jupiterCoreSource.singleFile) }) {
        exclude 'fabric.mod.json'
        exclude 'com/iafenvoy/jupiter/EntryPointLoader.class'
        exclude 'com/iafenvoy/jupiter/fabric/**'
        exclude 'com/iafenvoy/jupiter/network/fabric/**'
        exclude 'com/iafenvoy/jupiter/test/**'
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    dependsOn jupiterCoreJar
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"

    from(jupiterCoreJar.flatMap { it.archiveFile })

    relocate 'org.yaml', 'cn.evole.dependencies.yaml'
    relocate 'org.spongepowered.configurate', 'cn.evole.dependencies.spongepowered.configurate'
    relocate 'io.leangen', 'cn.evole.dependencies.leagen'
    relocate 'org.checkerframework', 'cn.evole.dependencies.checkerframework'
    relocate 'com.google.errorprone', 'cn.evole.dependencies.errorprone'
    relocate 'org.apiguardian', 'cn.evole.dependencies.apiguardian'
    relocate 'com.github.houbb', 'cn.evole.dependencies.houbb'
    relocate 'com.iafenvoy.jupiter', 'cn.evole.mods.mcbot.dependencies.jupiter'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    archiveClassifier = "fabric"
}
