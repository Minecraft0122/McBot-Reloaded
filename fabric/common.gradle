apply(plugin: "dev.architectury.loom")
apply(plugin: "com.replaymod.preprocess")
apply(plugin: "dev.vankka.dependencydownload.plugin")
apply(plugin: "com.github.johnrengelman.shadow")

preprocess {
    int mcVersion = vars.get()["MC"]
}


repositories {
    maven { url =  "https://api.modrinth.com/maven" }
    mavenCentral()
    ivy {
        name = 'OneBotGitHubReleases'
        url = 'https://github.com/cnlimiter/onebot-client/releases/download'
        patternLayout {
            artifact 'v[revision]/[artifact]-[revision].[ext]'
        }
        metadataSources { artifact() }
        content { includeModule 'cn.evole.onebot', 'OneBot-Client' }
    }
}

configurations {
    shadowBundle
}

//jar.dependsOn generateRuntimeDownloadResourceForRuntimeDownload

dependencies {
    minecraft ("com.mojang:minecraft:${minecraft_version}")
    mappings loom.officialMojangMappings()

    modImplementation ("net.fabricmc:fabric-loader:${loader_version}")
    modImplementation ("net.fabricmc.fabric-api:fabric-api:${fabric_version}")
    modImplementation include("dev.vankka:dependencydownload-runtime:1.3.1") {exclude module: 'jar-relocator'}
    modImplementation include("dev.vankka:dependencydownload-common:1.3.1")
    implementation shadowBundle("cn.evole.onebot:OneBot-Client:${onebot_client_version}") {transitive = false}
    implementation ("org.spongepowered:configurate-hocon:${hocon_version}")
    //implementation ("curse.maven:jupiter-1072905:${jupiter_version}")
    if (mcVersion == 11605) include ("org.slf4j:slf4j-api:2.0.7")
    modCompileOnly ("maven.modrinth:vanish:1.5.4+1.20.1")
    compileOnly ("org.projectlombok:lombok:1.18.30")
    annotationProcessor ("org.projectlombok:lombok:1.18.30")

}

loom {
    runConfigs.all {
        ideConfigGenerated = true
        runDir "../../run"
    }
}



loom {
    mixin {
        useLegacyMixinAp = false
    }
}

remapJar {
    remapperIsolation = true
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

version = mod_version + "-fabric"
group = maven_group
archivesBaseName = archives_base_name + "-" + minecraft_dependency

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            "mc_version"          : minecraft_dependency.replace(".", "_"),
            "version"             : mod_version,
            "minecraft_dependency": minecraft_dependency,
            "java_dependency"     : java_dependency
    ]
    inputs.properties replaceProperties

    filesMatching(["fabric.mod.json"]) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

jar {
    from("../../../LICENSE") {
        rename { "${it}_${archives_base_name}" }
    }
}

remapJar {
    inputFile.set(shadowJar.archiveFile)
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}
