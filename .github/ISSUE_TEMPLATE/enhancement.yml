name: 功能建议
description: 建议新功能或现有功能改进。
title: "[功能建议] "
labels: [ "enhancement" ]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已经搜索现有 issue 和拉取请求，确认没有重复建议。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 请说明当前遇到的限制或需要解决的问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请清晰说明希望增加或修改的功能，以及它能带来的改进。
    validations:
      required: true
