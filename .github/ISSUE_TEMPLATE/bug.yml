name: 报告漏洞
description: 报告可复现的错误，帮助我们改进 McBot Reloaded。
title: "[漏洞] "
labels: [ "bug" ]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已经搜索现有 issue 和拉取请求，确认没有重复报告。
          required: true
        - label: 我已经阅读 README 和更新日志，并确认问题仍然存在。
          required: true
        - label: 我已经删除配置、日志和截图中的令牌、QQ 号、群号、IP 地址等敏感信息。
          required: true
  - type: input
    id: java_version
    attributes:
      label: Java 版本
      placeholder: "例如：17.0.12"
    validations:
      required: true
  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft 版本
      placeholder: "例如：1.20.1"
    validations:
      required: true
  - type: input
    id: loader_version
    attributes:
      label: 加载器及版本
      placeholder: "例如：Fabric Loader 0.16.9 或 Forge 47.3.12"
    validations:
      required: true
  - type: input
    id: mcbot_version
    attributes:
      label: McBot 版本
      placeholder: "例如：2.3.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明预期行为和实际行为；可以附上截图。
    validations:
      required: true
  - type: textarea
    id: to_reproduce
    attributes:
      label: 复现步骤
      description: 请提供能稳定触发问题的最少步骤。
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 完整日志
      description: 请上传完整日志文件，不要只粘贴最后几行；提交前务必脱敏。
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: 配置文件
      description: 请提供 `mcbot/config.json`；删除令牌、QQ 号、群号和网络地址。
    validations:
      required: true
