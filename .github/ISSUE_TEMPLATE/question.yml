name: 使用咨询
description: 询问 README 未能解决的安装、配置或使用问题。
title: "[咨询] "
labels: [ "question" ]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已经阅读 README 并搜索现有 issue，仍未找到答案。
          required: true
        - label: 我不会提交访问令牌、QQ 号、群号、IP 地址等敏感信息。
          required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明使用环境、已经尝试的方法和具体疑问。
    validations:
      required: true
