name: '全版本巡检'

on:
  workflow_dispatch:
  schedule:
    # 每周一 02:00（北京时间）运行，cron 使用 UTC。
    - cron: '0 18 * * 0'

permissions:
  contents: read
  issues: write

concurrency:
  group: repository-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: '${{ matrix.minecraft }} 编译、单元测试与全加载器构建'
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.20.1'
            ref: '1.20.1'
            java: '17'
            loaders: 'fabric|forge'
          - minecraft: '1.21.1'
            ref: '1.21.1'
            java: '21'
            loaders: 'fabric|neoforge'

    steps:
      - name: '检出 ${{ matrix.ref }} 分支'
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - name: '配置构建 JDK ${{ matrix.java }}'
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: '配置 Gradle'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: '运行测试并构建全部加载器'
        shell: pwsh
        run: .\gradlew.bat clean build --no-daemon --stacktrace

      - name: '上传正式 JAR'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: weekly-${{ matrix.minecraft }}-${{ github.run_id }}
          retention-days: 14
          path: |
            fabric/build/libs/*-fabric.jar
            forge/build/libs/*-forge.jar
            neoforge/build/libs/*-neoforge.jar

      - name: '上传单元测试报告'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: weekly-test-reports-${{ matrix.minecraft }}-${{ github.run_id }}
          retention-days: 7
          path: common/build/reports/tests/

  java-runtime:
    name: '${{ matrix.minecraft }} / ${{ matrix.loader }} / Java ${{ matrix.java }} 服务端测试'
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.20.1'
            ref: '1.20.1'
            build_java: '17'
            loader: 'fabric'
            loader_version: '0.19.3'
            java: '17'
          - minecraft: '1.20.1'
            ref: '1.20.1'
            build_java: '17'
            loader: 'fabric'
            loader_version: '0.19.3'
            java: '21'
          - minecraft: '1.20.1'
            ref: '1.20.1'
            build_java: '17'
            loader: 'fabric'
            loader_version: '0.19.3'
            java: '25'
          - minecraft: '1.20.1'
            ref: '1.20.1'
            build_java: '17'
            loader: 'forge'
            loader_version: '47.4.22'
            java: '17'
          - minecraft: '1.20.1'
            ref: '1.20.1'
            build_java: '17'
            loader: 'forge'
            loader_version: '47.4.22'
            java: '21'
          - minecraft: '1.20.1'
            ref: '1.20.1'
            build_java: '17'
            loader: 'forge'
            loader_version: '47.4.22'
            java: '25'
          - minecraft: '1.21.1'
            ref: '1.21.1'
            build_java: '21'
            loader: 'fabric'
            loader_version: '0.19.3'
            java: '21'
          - minecraft: '1.21.1'
            ref: '1.21.1'
            build_java: '21'
            loader: 'fabric'
            loader_version: '0.19.3'
            java: '25'
          - minecraft: '1.21.1'
            ref: '1.21.1'
            build_java: '21'
            loader: 'neoforge'
            loader_version: '21.1.244'
            java: '21'
          - minecraft: '1.21.1'
            ref: '1.21.1'
            build_java: '21'
            loader: 'neoforge'
            loader_version: '21.1.244'
            java: '25'

    steps:
      - name: '检出 ${{ matrix.ref }} 分支'
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - name: '配置服务端运行 JDK ${{ matrix.java }}'
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: '记录服务端运行 JDK'
        shell: pwsh
        run: '"MCBOT_RUNTIME_JAVA_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: '配置 Gradle 基准 JDK ${{ matrix.build_java }}'
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.build_java }}
          distribution: 'temurin'

      - name: '配置 Gradle'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: '构建 ${{ matrix.loader }} 正式 JAR'
        shell: pwsh
        run: .\gradlew.bat ':${{ matrix.loader }}:remapJar' --no-daemon --stacktrace

      - name: '安装、启动并正常关闭真实服务端'
        shell: pwsh
        run: >-
          .\.github\scripts\test-java-runtime.ps1
          -Loader '${{ matrix.loader }}'
          -MinecraftVersion '${{ matrix.minecraft }}'
          -LoaderVersion '${{ matrix.loader_version }}'
          -ExpectedJava ${{ matrix.java }}

      - name: '上传服务端日志'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: weekly-${{ matrix.minecraft }}-java-${{ matrix.java }}-${{ matrix.loader }}-logs-${{ github.run_id }}
          retention-days: 7
          path: |
            build/java-runtime/${{ matrix.loader }}-java-${{ matrix.java }}/logs/
            build/java-runtime/${{ matrix.loader }}-java-${{ matrix.java }}/crash-reports/

  quality-gate:
    name: '全版本质量门禁'
    if: ${{ always() }}
    needs:
      - build
      - java-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: '汇总并判定巡检结果'
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          RUNTIME_RESULT: ${{ needs.java-runtime.result }}
        run: |
          {
            echo '## McBot 全版本巡检'
            echo
            echo "- 两个 Minecraft 版本的构建与单元测试：${BUILD_RESULT}"
            echo "- 十组正式 Java 运行矩阵测试：${RUNTIME_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$BUILD_RESULT" != 'success' || "$RUNTIME_RESULT" != 'success' ]]; then
            echo '全版本巡检失败。' >&2
            exit 1
          fi

          echo '- 结论：全部维护版本继续满足支持标准。' >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    name: '登记巡检失败'
    if: ${{ always() && (needs.build.result != 'success' || needs.java-runtime.result != 'success') }}
    needs:
      - build
      - java-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: '创建或更新 GitHub Issue'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUNTIME_RESULT: ${{ needs.java-runtime.result }}
        run: |
          title='[自动巡检] 全版本测试失败'
          body=$(cat <<EOF
          GitHub 全版本巡检未通过，需要维护者处理。

          - 构建与单元测试：${BUILD_RESULT}
          - 真实服务端运行矩阵：${RUNTIME_RESULT}
          - 工作流：${RUN_URL}

          请按照 [GitHub 测试规范](${GITHUB_SERVER_URL}/${REPOSITORY}/blob/1.20.1/TESTING_STANDARD.md) 检查日志、确认受影响矩阵，并通过新的提交重新运行完整质量门禁。
          EOF
          )

          issue_number=$(gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --search '"[自动巡检] 全版本测试失败" in:title' \
            --json number,title \
            --jq '.[] | select(.title == "[自动巡检] 全版本测试失败") | .number' \
            | head -n 1)

          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --repo "$REPOSITORY" --body "$body"
          else
            gh issue create --repo "$REPOSITORY" --title "$title" --body "$body" --label bug
          fi
