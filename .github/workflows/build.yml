name: '持续集成'

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: '测试并构建 Fabric / NeoForge'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: '检出仓库'
        uses: actions/checkout@v7

      - name: '配置 JDK 21'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: '配置 Gradle'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: '运行测试并构建全部加载器'
        shell: pwsh
        run: .\gradlew.bat clean build --no-daemon --stacktrace

      - name: '上传可安装构建产物'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: McBot-${{ github.sha }}
          retention-days: 14
          path: |
            fabric/build/libs/*-fabric.jar
            neoforge/build/libs/*-neoforge.jar

      - name: '上传测试报告'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: test-reports-${{ github.sha }}
          retention-days: 7
          path: common/build/reports/tests/
