name: '持续集成'

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: '测试并构建 Fabric / Forge'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: '检出仓库'
        uses: actions/checkout@v7

      - name: '配置 JDK 17'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: '配置 Gradle'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: '运行测试并构建全部加载器'
        shell: pwsh
        run: .\gradlew.bat clean build --no-daemon --stacktrace

      - name: '上传可安装构建产物'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: McBot-${{ github.sha }}
          retention-days: 14
          path: |
            fabric/build/libs/*-fabric.jar
            forge/build/libs/*-forge.jar

      - name: '上传测试报告'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: test-reports-${{ github.sha }}
          retention-days: 7
          path: common/build/reports/tests/

  java-runtime:
    name: 'Java ${{ matrix.java }} / ${{ matrix.loader }} 服务端启动测试'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java:
          - '21'
          - '25'
        loader:
          - fabric
          - forge

    steps:
      - name: '检出仓库'
        uses: actions/checkout@v7

      - name: '配置服务端运行 JDK ${{ matrix.java }}'
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: '记录服务端运行 JDK'
        shell: pwsh
        run: '"MCBOT_RUNTIME_JAVA_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: '配置 Gradle 基准 JDK 17'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: '配置 Gradle'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: '使用 Java ${{ matrix.java }} 启动并关闭服务端'
        shell: pwsh
        run: >-
          .\.github\scripts\test-java-runtime.ps1
          -Loader '${{ matrix.loader }}'
          -ExpectedJava ${{ matrix.java }}

      - name: '上传服务端日志'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: java-${{ matrix.java }}-${{ matrix.loader }}-server-logs-${{ github.sha }}
          retention-days: 7
          path: |
            run/logs/
            run/crash-reports/
            ${{ matrix.loader }}/run/logs/
            ${{ matrix.loader }}/run/crash-reports/
