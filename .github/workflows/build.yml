name: '1.7.10 持续集成'

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: '检出仓库'
        uses: actions/checkout@v7
      - name: '配置 JDK 8'
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
      - name: '构建'
        run: ./gradlew clean build --no-daemon --stacktrace
      - name: '上传可安装产物'
        uses: actions/upload-artifact@v7
        with:
          name: McBot-1.7.10-${{ github.sha }}
          if-no-files-found: error
          path: build/libs/McBot-1.7.10-*.jar
