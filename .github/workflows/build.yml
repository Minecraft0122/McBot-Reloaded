name: '旧版 Fabric 构建巡检'

on:
  push:
    branches: ['fabric']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: '检出仓库'
        uses: actions/checkout@v7
      - name: '配置 JDK 21'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: '配置 Gradle'
        uses: gradle/actions/setup-gradle@v6
      - name: '构建 Minecraft 1.19.2 回归目标'
        working-directory: fabric
        run: chmod +x gradlew && ./gradlew :1.19.2:build --no-daemon --stacktrace
      - name: '上传构建产物'
        uses: actions/upload-artifact@v7
        with:
          name: McBot-Fabric-1.19.2-${{ github.sha }}
          if-no-files-found: error
          path: fabric/versions/1.19.2/build/libs/*-fabric.jar
