name: '持续集成'

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: '测试并构建 Fabric / Forge'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: '检出仓库'
        uses: actions/checkout@v7

      - name: '配置 JDK 17'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: '配置 Gradle'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: '运行测试并构建全部加载器'
        shell: pwsh
        run: .\gradlew.bat clean build --no-daemon --stacktrace

      - name: '上传可安装构建产物'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: McBot-${{ github.sha }}
          retention-days: 14
          path: |
            fabric/build/libs/*-fabric.jar
            forge/build/libs/*-forge.jar

      - name: '上传测试报告'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: test-reports-${{ github.sha }}
          retention-days: 7
          path: common/build/reports/tests/

  java-runtime:
    name: 'Java ${{ matrix.java }} / ${{ matrix.loader.name }} 服务端启动测试'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java:
          - '17'
          - '21'
          - '25'
        loader:
          - name: fabric
            version: '0.19.3'
          - name: forge
            version: '47.4.22'

    steps:
      - name: '检出仓库'
        uses: actions/checkout@v7

      - name: '配置服务端运行 JDK ${{ matrix.java }}'
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: '记录服务端运行 JDK'
        shell: pwsh
        run: '"MCBOT_RUNTIME_JAVA_HOME=$env:JAVA_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: '配置 Gradle 基准 JDK 17'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: '配置 Gradle'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: '构建 ${{ matrix.loader.name }} 正式 JAR'
        shell: pwsh
        run: .\gradlew.bat ':${{ matrix.loader.name }}:remapJar' --no-daemon --stacktrace

      - name: '使用 Java ${{ matrix.java }} 安装、启动并关闭服务端'
        shell: pwsh
        run: >-
          .\.github\scripts\test-java-runtime.ps1
          -Loader '${{ matrix.loader.name }}'
          -MinecraftVersion '1.20.1'
          -LoaderVersion '${{ matrix.loader.version }}'
          -ExpectedJava ${{ matrix.java }}

      - name: '上传服务端日志'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: java-${{ matrix.java }}-${{ matrix.loader.name }}-server-logs-${{ github.sha }}
          retention-days: 7
          path: |
            build/java-runtime/${{ matrix.loader.name }}-java-${{ matrix.java }}/logs/
            build/java-runtime/${{ matrix.loader.name }}-java-${{ matrix.java }}/crash-reports/

  quality-gate:
    name: '质量门禁'
    if: ${{ always() }}
    needs:
      - build
      - java-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: '汇总并判定测试结果'
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          RUNTIME_RESULT: ${{ needs.java-runtime.result }}
        run: |
          {
            echo '## McBot 质量门禁'
            echo
            echo "- 编译、单元测试与正式 JAR：${BUILD_RESULT}"
            echo "- Java 17/21/25 服务端运行矩阵：${RUNTIME_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$BUILD_RESULT" != 'success' || "$RUNTIME_RESULT" != 'success' ]]; then
            echo '一个或多个必需测试未通过。' >&2
            exit 1
          fi

          echo '- 结论：允许合并。' >> "$GITHUB_STEP_SUMMARY"
