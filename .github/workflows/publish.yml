name: '自动发布'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: '验证、构建并发布'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: '检出仓库'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: '配置 JDK 17'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: '配置 Gradle'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: '校验标签与模组版本'
        shell: pwsh
        run: |
          $versionLine = Select-String -Path gradle.properties -Pattern '^mod_version=(.+)$'
          if (-not $versionLine) {
            throw 'gradle.properties 中缺少 mod_version'
          }
          $modVersion = $versionLine.Matches[0].Groups[1].Value.Trim()
          $expectedTag = "v$modVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "标签 $env:GITHUB_REF_NAME 与 mod_version=$modVersion 不一致；应使用 $expectedTag"
          }
          "MOD_VERSION=$modVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: '运行测试并构建全部加载器'
        shell: pwsh
        run: .\gradlew.bat clean build --no-daemon --stacktrace

      - name: '整理产物并生成 SHA-256 校验和'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          $fabric = @(Get-ChildItem fabric/build/libs/*-fabric.jar -File)
          $forge = @(Get-ChildItem forge/build/libs/*-forge.jar -File)
          if ($fabric.Count -ne 1 -or $forge.Count -ne 1) {
            throw "预期各有一个 Fabric 和 Forge 正式 JAR，实际为 Fabric=$($fabric.Count)、Forge=$($forge.Count)"
          }
          Copy-Item $fabric[0].FullName, $forge[0].FullName -Destination release
          Get-ChildItem release/*.jar -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Out-File release/SHA256SUMS.txt -Encoding ascii

      - name: '生成构建来源证明'
        uses: actions/attest@v4
        with:
          subject-path: 'release/*.jar'

      - name: '保存发布产物'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: McBot-v${{ env.MOD_VERSION }}
          retention-days: 30
          path: release/

      - name: '创建版本发布'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME $assets `
            --verify-tag `
            --generate-notes `
            --title "McBot $env:MOD_VERSION（Minecraft 1.20.1）"
