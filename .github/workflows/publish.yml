name: '自动发布'

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: '构建 Minecraft ${{ matrix.minecraft }}'
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.20.1'
            ref: '1.20.1'
            java: '17'
            loaders: 'fabric|forge'
          - minecraft: '1.21.1'
            ref: '1.21.1'
            java: '21'
            loaders: 'fabric|neoforge'

    steps:
      - name: '检出版本分支'
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: '配置 JDK ${{ matrix.java }}'
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: '配置 Gradle'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: '校验标签、模组版本与 Minecraft 版本'
        shell: pwsh
        run: |
          $versionLine = Select-String -Path gradle.properties -Pattern '^mod_version=(.+)$'
          $minecraftLine = Select-String -Path gradle.properties -Pattern '^minecraft_version=(.+)$'
          if (-not $versionLine -or -not $minecraftLine) {
            throw 'gradle.properties 中缺少 mod_version 或 minecraft_version'
          }
          $modVersion = $versionLine.Matches[0].Groups[1].Value.Trim()
          $minecraftVersion = $minecraftLine.Matches[0].Groups[1].Value.Trim()
          if ($env:GITHUB_REF_NAME -ne $modVersion) {
            throw "标签 $env:GITHUB_REF_NAME 与 mod_version=$modVersion 不一致"
          }
          if ($minecraftVersion -ne '${{ matrix.minecraft }}') {
            throw "分支 Minecraft 版本 $minecraftVersion 与发布矩阵 ${{ matrix.minecraft }} 不一致"
          }

      - name: '运行测试并构建全部加载器'
        shell: pwsh
        run: .\gradlew.bat clean build --no-daemon --stacktrace

      - name: '整理可安装产物'
        shell: pwsh
        env:
          LOADER_PATTERN: ${{ matrix.loaders }}
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          $jars = @(Get-ChildItem -Path fabric,forge,neoforge -Filter *.jar -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -like '*build\libs' -and $_.Name -match "-($env:LOADER_PATTERN)\.jar$" })
          if ($jars.Count -ne 2) {
            throw "Minecraft ${{ matrix.minecraft }} 预期有两个正式 JAR，实际为 $($jars.Count)：$($jars.Name -join ', ')"
          }
          Copy-Item $jars.FullName -Destination release

      - name: '生成构建来源证明'
        uses: actions/attest@v4
        with:
          subject-path: 'release/*.jar'

      - name: '上传版本产物'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: release-${{ matrix.minecraft }}
          retention-days: 30
          path: release/*.jar

  release:
    name: '汇总并创建 GitHub Release'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: '检出发布提交'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: '下载全部版本产物'
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release/
          merge-multiple: true

      - name: '生成 SHA-256 校验和'
        shell: pwsh
        run: |
          $jars = @(Get-ChildItem release/*.jar -File | Sort-Object Name)
          if ($jars.Count -ne 4) {
            throw "预期汇总四个正式 JAR，实际为 $($jars.Count)"
          }
          $jars | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Out-File release/SHA256SUMS.txt -Encoding ascii

      - name: '创建版本发布'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME $assets `
            --verify-tag `
            --generate-notes `
            --title "McBot $env:GITHUB_REF_NAME"
